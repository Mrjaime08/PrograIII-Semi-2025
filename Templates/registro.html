<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>UROMED - Crear Cuenta</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f0fdf4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .register-container {
            background-color: white;
            border: 2px solid #4CAF50;
            border-radius: 8px;
            padding: 30px 40px;
            width: 400px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            text-align: center;
        }

        .logo {
            font-size: 1.5em;
            font-weight: bold;
            color: #4CAF50;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #2e7d32;
            font-size: 1em;
            margin-bottom: 20px;
        }

        h2 {
            margin-bottom: 20px;
            color: #333;
        }

        label {
            display: block;
            text-align: left;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 8px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #388E3C;
        }

        a {
            display: block;
            margin-top: 15px;
            color: #2e7d32;
            text-decoration: none;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="logo">UROMED</div>
        <div class="subtitle">Medico IA</div>
        <h2>CREAR CUENTA NUEVA</h2>
        <form action="{{ url_for('crear_usuario') }}" method="POST">
            <label>Nombre de Usuario:</label>
            <input type="text" name="username" required>

            <label>Correo electrónico:</label>
            <input type="email" name="email" required>

            <label>Contraseña:</label>
            <input type="password" name="password" required>

            <label>Confirmar contraseña:</label>
            <input type="password" name="confirm_password" required>

            <label>Rol:</label>
            <select name="rol" required>
                <option value="">Seleccione su rol</option>
                <option value="doctor">Doctor</option>
                <option value="enfermero">Enfermer@</option>
                <option value="asistente">Asistente</option>
            </select>

            <button type="submit">CREAR CUENTA</button>
        </form>
        <a href="{{ url_for('login') }}">¿Ya tienes cuenta? Haz clic Aquí</a>
    </div>
</body>
</html>
