<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Modificar expediente</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f0fdf4;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #4CAF50;
            color: white;
            padding: 20px;
            text-align: center;
        }

        main {
            padding: 30px;
            max-width: 800px;
            margin: auto;
        }

        form {
            background-color: #ffffff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.05);
            color: #2e7d32;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
            color: #33691e;
        }

        input, textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        .btn {
            margin-top: 20px;
            padding: 10px 15px;
            background-color: #66bb6a;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .btn:hover {
            background-color: #4caf50;
        }

        .acciones {
            display: flex;
            gap: 10px;
        }

        footer {
            background-color: #e8f5e9;
            text-align: center;
            padding: 15px;
            font-size: 0.9em;
            color: #777;
            border-top: 1px solid #c8e6c9;
            margin-top: 40px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Modificar expediente</h1>
    </header>

    <main>
        <form method="POST" action="{{ url_for('actualizar_expediente', id=expediente.id) }}" enctype="multipart/form-data">
            <label>Nombres:</label>
            <input type="text" name="nombres" value="{{ expediente.nombres }}" required>

            <label>Apellidos:</label>
            <input type="text" name="apellidos" value="{{ expediente.apellidos }}" required>

            <label>Teléfono:</label>
            <input type="text" name="telefono" value="{{ expediente.telefono }}">

            <label>Dirección:</label>
            <input type="text" name="direccion" value="{{ expediente.direccion }}">

            <label>Correo electrónico:</label>
            <input type="email" name="correo" value="{{ expediente.correo }}">

            <label>Edad:</label>
            <input type="number" name="edad" value="{{ expediente.edad }}">

            <label>Enfermedad:</label>
            <input type="text" name="enfermedad" value="{{ expediente.enfermedad }}">

            <label>Imagen del paciente (opcional):</label>
            <input type="file" name="imagen">

            <div class="acciones">
                <button type="submit" class="btn">Guardar cambios</button>
                <button type="button" class="btn" onclick="confirmarCancelacion()">Cancelar</button>
            </div>
        </form>
    </main>

    <footer>
        &copy; 2025 UROMED - Todos los derechos reservados
    </footer>

    <script>
        function confirmarCancelacion() {
            const confirmar = confirm("¿Estás seguro de cancelar la modificación?");
            if (confirmar) {
                window.location.href = "{{ url_for('ver_expediente', id=expediente.id) }}";
            }
        }
    </script>
</body>
</html>
